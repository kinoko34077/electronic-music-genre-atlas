": 2025, "style_evidence": "2025年のChime公式EP内の原曲。EPの存在は確認、単曲のColour Bass代表性は未確認。", "representative_role": "現在継承候補", "selection_reason": "2025年のChime公式EP内の原曲。EPの存在は確認、単曲のColour Bass代表性は未確認。", "source_title": "Monstercat｜Between（EP）", "source_date": "2025-08-13", "source_url": "https://www.monstercat.com/release/742779557353", "source_mentions": "2025年のChime公式EP内の原曲。EPの存在は確認、単曲のColour Bass代表性は未確認。", "evidence_grade": "C", "audio_service": "Apple Music", "audio_url": "https://music.apple.com/us/song/1826592508", "link_credit_version_check": "曲名・名義・版は配信ページの公開メタデータと照合", "audio_playback_check": "ブラウザ上の実音声再生は未検証", "checked_on": "2026-11-14", "state": "音源確認", "note": "公式側のジャンル関連性は確認。独立した代表性A/Bの根拠は未達。"}]}</script><script>
'use strict';
const D=JSON.parse(document.getElementById('dataset').textContent);
let selected=0, period='all';
const nav=document.getElementById('nav'), main=document.getElementById('main');
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function safeUrl(u){try{const v=new URL(u);return (v.protocol==='https:'||v.protocol==='http:')?escapeHtml(v.href):'#';}catch{return '#';}}
function groupItems(){let g={};D.genres.forEach(x=>(g[x.group]??=[]).push(x));return g;}
function renderNav(){const q=document.getElementById('genreSearch').value.toLowerCase().trim();nav.innerHTML=Object.entries(groupItems()).map(([key,arr])=>{let visible=arr.filter(x=>x.name.toLowerCase().includes(q)||x.number.includes(q));if(!visible.length)return '';return `<div class="navgroup">${key} / ${escapeHtml(D.groups[key])}</div>`+visible.map(x=>`<button class="navbutton ${x.id===selected?'active':''}" data-select="${x.id}" aria-current="${x.id===selected?'page':'false'}"><span class="number">${x.number}</span><span>${escapeHtml(x.name)}</span></button>`).join('')}).join('');}
function countsFor(id){const a=D.tracks.filter(x=>x.genre_id===id);return [a.filter(x=>x.period==='初期').length,a.filter(x=>x.period==='現在').length]}
function renderHome(){document.getElementById('breadcrumbs').textContent='ARCHIVE / ALL 51 GENRES';
main.innerHTML=`<div class="hero"><div class="eyebrow">RESEARCH IN PROGRESS — NOT A COMPLETE CATALOGUE</div><h1>電子音楽の、<br>枝分かれする歴史。</h1><p>Complextro、Glitch Hop、Colour Bassを軸に、51の名称・系譜・制作文化を比較する調査台帳。確定していないジャンルや楽曲には検証状態を明示しています。</p></div>${stats()}<div class="warning">この版は調査途中です。51系統の固定一覧は収録していますが、510曲の選定・再生検収は未完了。過去の候補343件という報告値は現在の検証済み件数へ合算していません。</div><div class="sectionhead"><h2 class="sectiontitle">51系統のインベントリ</h2><p>ジャンル名を選んで詳細を表示</p></div><div class="quickgroups">${Object.entries(D.groups).map(([k,v])=>`<button data-scrollgroup="${k}">${k}　${escapeHtml(v)}</button>`).join('')}</div><div class="allgrid">${D.genres.map(g=>{const [a,b]=countsFor(g.id);return `<button id="grp-${g.group}-${g.id}" data-select="${g.id}" class="${a+b?'done':''}"><small>${g.number} / ${g.group}</small>${escapeHtml(g.name)}${a+b?`<br><span>確認済み候補 ${a+b}件</span>`:''}</button>`}).join('')}</div>${footer()}`;
}
function stats(){return `<div class="stats"><div class="stat"><strong>51 <span style="font-size:13px;color:#91aabb">系統</span></strong><small>固定インベントリ / 全件表示</small></div><div class="stat"><strong>510 <span style="font-size:13px;color:#91aabb">曲枠</span></strong><small>初期5＋現在5 × 51</small></div><div class="stat"><strong>${D.meta.audio_page_verified} <span style="font-size:13px;color:#91aabb">曲</span></strong><small>この版で正規の個別音源ページ照合</small></div><div class="stat"><strong>${D.meta.third_party_grade_A_or_B} <span style="font-size:13px;color:#91aabb">曲</span></strong><small>曲名を挙げたA/Bの資料あり</small></div></div>`}
function sourceLinks(g){return g.evidence_urls.length?g.evidence_urls.map((u,i)=>`<a href="${safeUrl(u)}" target="_blank" rel="noopener noreferrer">${i+1}. ${escapeHtml(u.replace(/^https?:\/\//,''))} ↗</a>`).join(''): '<p class="note">定義・起源の外部資料は未収集です。</p>'}
function renderGenre(){let g=D.genres[selected-1];let matches=D.tracks.filter(t=>t.genre_id===g.id);const [a,b]=countsFor(selected);document.getElementById('breadcrumbs').textContent=`ARCHIVE / ${g.group} / ${g.number}`;
main.innerHTML=`<button id="backButton" class="menu" style="display:inline-block;margin-bottom:22px">← 全51系統へ戻る</button><div class="hero"><div class="eyebrow">${escapeHtml(g.group)} / ${escapeHtml(g.group_name)} · NO. ${g.number}</div><h1>${escapeHtml(g.name)}</h1><p>${escapeHtml(g.brief_user_definition)}</p><div class="pills"><span class="pill ${g.classification_status==='未検証'?'muted':'glow'}">${escapeHtml(g.classification_status)}</span><span class="pill">${escapeHtml(g.classification)}</span><span class="pill">曲候補 初期 ${a}/5 ｜現在 ${b}/5</span></div></div><div class="warning">${escapeHtml(g.notes)}</div><div class="genreintro"><section class="card"><div class="kicker">HISTORY / LINEAGE</div><h2 class="sectiontitle">成立と系譜</h2><p>${escapeHtml(g.genealogy||'資料検証前。依頼書の定義を保持し、起源・名称成立・シーン形成・普及を区別して再調査する。')}</p><p class="note">${escapeHtml(g.time_origin?`起点：${g.time_origin}`:'成立時期：未確定')}<br>${escapeHtml(g.time_scene||'シーン形成：未確定')}<br>${escapeHtml(g.time_popularity||'商業的流行・一般認知：未確定')}</p></section><section class="card"><div class="kicker">EVIDENCE / SOURCE LOG</div><h2 class="sectiontitle">ジャンル資料</h2><div class="sourcebox">${sourceLinks(g)}</div><p class="note">外部資料は一次情報・専門媒体を重視。曲の代表性とは別に判定。</p></section></div><div class="timeline"><div class="period early"><div class="eyebrow">EARLY ERA</div><h3>初期：成立・定着期</h3><p>${escapeHtml(g.initial_characteristics||'ジャンル成立期・名称成立期・シーン形成期を調査中。単に古い曲を採用しない。')}</p></div><div class="period now"><div class="eyebrow">CONTEMPORARY / 2022–2026</div><h3>現在：継続・変異期</h3><p>${escapeHtml(g.recent_characteristics||'2022〜2026年の新作による継承・変異を調査中。旧作の再流行と混同しない。')}</p></div></div><div class="sectionhead"><h2 class="sectiontitle">選定曲と正規音源</h2><p id="shownCount">${matches.length} 件</p></div><div class="searchbar"><label for="songSearch" class="sr-only">曲名またはアーティスト名を検索</label><input type="search" id="songSearch" placeholder="曲名・アーティストを検索…" autocomplete="off"><div class="tabs" role="group" aria-label="初期・現在フィルタ"><button data-period="all" class="active">全て</button><button data-period="初期">初期</button><button data-period="現在">現在</button></div></div><div id="songList" class="songlist"></div>${footer()}`;
document.getElementById('songSearch').addEventListener('input',renderTracks);document.querySelectorAll('[data-period]').forEach(el=>el.addEventListener('click',()=>{period=el.dataset.period;document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x===el));renderTracks()}));period='all';renderTracks();}
function renderTracks(){const q=(document.getElementById('songSearch')?.value||'').toLowerCase().trim();let t=D.tracks.filter(x=>x.genre_id===selected&&(period==='all'||x.period===period)&&(!q||`${x.title} ${x.artist}`.toLowerCase().includes(q)));document.getElementById('shownCount').textContent=`${t.length} 件`;document.getElementById('songList').innerHTML=t.length?t.map(x=>`<article class="songcard"><div class="songicon" aria-hidden="true">♫</div><div><div class="eyebrow" style="font-size:10px;color:${x.period==='初期'?'#b3b4d0':'#64d9c5'}">${x.period==='初期'?'EARLY':'NOW'} / ${x.original_year} / ${escapeHtml(x.version)}</div><div class="songtitle">${escapeHtml(x.title)}</div><div class="subline">${escapeHtml(x.artist)}　·　${escapeHtml(x.audio_service)}</div><p class="songnote">${escapeHtml(x.selection_reason)}</p><div class="songrefs"><span class="sourcegrade">根拠 ${escapeHtml(x.evidence_grade)}</span><span class="sourcegrade">${escapeHtml(x.state)}</span><a href="${safeUrl(x.source_url)}" rel="noopener noreferrer" target="_blank" title="${escapeHtml(x.source_title)}">選定根拠 ↗</a><span class="subline">※実再生未検証</span></div></div><a class="songlink" href="${safeUrl(x.audio_url)}" target="_blank" rel="noopener noreferrer" aria-label="${escapeHtml(x.title)} の正規音源ページを開く">▶ 再生ページ ↗</a></article>`).join(''):`<div class="empty">${q?'この条件の曲は台帳にありません。':'条件に該当する照合済み曲はありません。'}<br>未収集・出典未確認の曲は表示していません。</div>`;}
function footer(){return `<div class="foot">SONIC LINEAGE — 調査基準日 2026-11-14<br>正規個別音源のページに到達することを公開メタデータで照合。実音声再生・地域制限・iPhone実機操作までは確認できていないため、この版は合格宣言しません。</div>`}
function select(n){selected=n;period='all';document.body.classList.remove('drawer');renderNav();selected===0?renderHome():renderGenre();window.scrollTo(0,0);}
document.getElementById('genreSearch').addEventListener('input',renderNav);
document.getElementById('menuButton').addEventListener('click',()=>document.body.classList.toggle('drawer'));
document.getElementById('backdrop').addEventListener('click',()=>document.body.classList.remove('drawer'));
window.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('drawer')});
document.body.addEventListener('click',e=>{const sel=e.target.closest('[data-select]');if(sel){select(+sel.dataset.select);return}if(e.target.closest('#backButton')){select(0);return}const grp=e.target.closest('[data-scrollgroup]');if(grp){const el=document.querySelector(`[id^="grp-${grp.dataset.scrollgroup}-"]`);el?.scrollIntoView({behavior:'smooth',block:'center'})}});
select(0);
</script></body></html>
